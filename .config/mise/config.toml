[env]
DOTFILES = "{{env.HOME}}/dotfiles"
_.python.venv = { path = "{{env.HOME}}/.venv/default", create = true }

[tasks."python:sync"]
description = "Sync global python venv with dotfiles"
run = "mise sync python -q --silent --uv -y && uv pip install -qr $DOTFILES/requirements.txt && uv pip freeze > $DOTFILES/uv.lock"
sources = ["{{env.HOME}}/dotfiles/requirements.txt"]
outputs = ["{{env.HOME}}/.venv/default/bin/python"]

[tasks."python:tools"]
description = "Install python CLI tools that need plugins in one env (mdformat)"
run = """
uv tool install -q --force mdformat \
--with mdformat-gfm \
--with mdformat-gfm-alerts \
--with mdformat-deflist \
--with mdformat-footnote \
--with mdformat-frontmatter \
"""
sources = ["{{env.HOME}}/.local/bin/mdformat"]

[tasks."zsh:completions"]
description = "Setup ZSH completions"
run = "$DOTFILES/scripts/src/setup-zsh.sh completions"
sources = ["{{env.DOTFILES}}/scripts/src/setup-zsh.sh"]
outputs = ["{{env.XDG_DATA_HOME}}/zsh/completions/_mise"]

[tasks."zsh:plugins"]
description = "Setup ZSH plugins"
run = "$DOTFILES/scripts/src/setup-zsh.sh plugins"
sources = ["{{env.DOTFILES}}/scripts/src/setup-zsh.sh"]
outputs = ["{{env.XDG_DATA_HOME}}/zsh/plugins/zsh-defer"]

[tasks."zsh:setup"]
description = "Setup ZSH completions and plugins"
depends = ["zsh:completions", "zsh:plugins"]
