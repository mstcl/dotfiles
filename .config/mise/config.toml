age = "latest"
direnv = "latest"
zoxide = "latest"
eza = "latest"
"github:tree-sitter/tree-sitter" = "latest"
just = "latest"
pandoc = "latest"
jq = "latest"
yq = "latest"
"go:github.com/umlx5h/gtrash" = "latest"
"github:KSXGitHub/parallel-disk-usage" = "latest"
"cargo:rbw" = "latest"
